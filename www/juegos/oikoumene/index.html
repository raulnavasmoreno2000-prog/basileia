<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Oikoumene</title>
<!--basileia--><link rel="stylesheet" href="../../comun/fuentes.css"><!--basileia-->
<style>
/* Disposición: el mapa ocupa toda la pantalla; la interfaz son láminas flotantes sobre él, pegadas a los bordes. */
:root {
  --sea: #cfdcde; --sea-ink: #7d989e; --land: #e8e3d4; --land-ink: #b3ab95; --coast: #5f747a; --indep: #cfc8b3;
  --paper: #fbfaf5; --paper-2: #f0eee4; --ink: #1d2a30; --ink-2: #5a686d; --line: #d8d4c5;
  --accent: #6d2a52; --accent-ink: #ffffff; --accent-soft: #efe0e8;
  --gold: #94700f; --good: #2a7652; --warn: #a56a12; --bad: #a83a3a;
  --map-ink: #16222a; --veil: rgba(29, 42, 48, .32);
  --shadow: 0 1px 2px rgba(29, 42, 48, .08), 0 10px 28px rgba(29, 42, 48, .12);
  --display: 'GFS Didot', Didot, 'Bodoni MT', 'Libre Bodoni', Georgia, serif;
  --body: 'Commissioner', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 10px; --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #15222a; --sea-ink: #54717b; --land: #2a3338; --land-ink: #56666c; --coast: #0b141a; --indep: #55636a;
    --paper: #1b272d; --paper-2: #24333a; --ink: #ece8dc; --ink-2: #9fb0b5; --line: #35464e;
    --accent: #dba3c4; --accent-ink: #2a1020; --accent-soft: #3a2a35;
    --gold: #dcb75a; --good: #6dbf95; --warn: #e0a84e; --bad: #e58383;
    --veil: rgba(5, 10, 13, .55);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #15222a; --sea-ink: #54717b; --land: #2a3338; --land-ink: #56666c; --coast: #0b141a; --indep: #55636a;
  --paper: #1b272d; --paper-2: #24333a; --ink: #ece8dc; --ink-2: #9fb0b5; --line: #35464e;
  --accent: #dba3c4; --accent-ink: #2a1020; --accent-soft: #3a2a35;
  --gold: #dcb75a; --good: #6dbf95; --warn: #e0a84e; --bad: #e58383;
  --veil: rgba(5, 10, 13, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--sea); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }

/* ---------- mapa ---------- */
#waste { fill: var(--land); }
#coast { fill: none; stroke: var(--coast); stroke-width: .9; vector-effect: non-scaling-stroke; opacity: .7; }
#rivers { fill: none; stroke: var(--sea); stroke-width: 1.3; vector-effect: non-scaling-stroke; opacity: .9; stroke-linecap: round; }
.prov { stroke: none; cursor: pointer; transition: fill .25s; }
.b { fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
.b-in { stroke: var(--map-ink); stroke-opacity: .16; stroke-width: .7; }
.b-out { stroke: var(--map-ink); stroke-opacity: .78; stroke-width: 1.5; }
.b-edge { stroke: var(--map-ink); stroke-opacity: .3; stroke-width: .8; }
.link { fill: none; stroke: var(--sea-ink); stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; opacity: .75; pointer-events: none; }
.hl { fill: none; pointer-events: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.hl-sel { stroke: #ffffff; stroke-width: 3.5; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .6)); }
.hl-move { stroke: #ffffff; stroke-width: 2; stroke-dasharray: 5 4; opacity: .95; filter: drop-shadow(0 0 1px rgba(0, 0, 0, .5)); }
.hl-atk { stroke: #c2302b; stroke-width: 2.6; }
.hl-for { stroke: var(--map-ink); stroke-width: 1.6; stroke-dasharray: 2 4; opacity: .7; }
.deco { font-family: var(--display); font-style: italic; pointer-events: none; text-anchor: middle; }
.deco.sea { fill: var(--sea-ink); letter-spacing: .12em; }
.deco.land { fill: var(--land-ink); letter-spacing: .3em; font-style: normal; text-transform: uppercase; }
.flabel { font-family: var(--display); fill: var(--map-ink); fill-opacity: .56; text-anchor: middle; dominant-baseline: central; pointer-events: none; text-transform: uppercase; }
.city circle { fill: var(--map-ink); fill-opacity: .8; }
.city .cap { fill: none; stroke: var(--map-ink); stroke-opacity: .8; stroke-width: 1.2; }
.city text { font: 500 11px var(--body); fill: var(--map-ink); paint-order: stroke; stroke: rgba(255, 255, 255, .55); stroke-width: 2.5px; stroke-linejoin: round; }
.city { pointer-events: none; }
.army { pointer-events: none; }
.army rect { stroke: rgba(255, 255, 255, .85); stroke-width: 1; }
.army text { font: 600 11px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
.army.mine rect { stroke: #fff; stroke-width: 1.6; }
.army .rdy { fill: #fff; }
.army.spent { opacity: .72; }

/* ---------- láminas ---------- */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
#bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: stretch; gap: 4px 18px; flex-wrap: wrap; padding: calc(8px + env(safe-area-inset-top, 0px)) var(--gut) 8px; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); z-index: 5; }
#b-fac { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 2px 6px 2px 0; text-align: left; min-width: 0; }
#b-fac .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .45), 0 0 0 1px var(--line); }
#b-fac b { display: block; font: 400 18px/1.1 var(--display); }
#b-fac small { display: block; color: var(--ink-2); font-size: 12px; }
.stats { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.st { display: flex; flex-direction: column; line-height: 1.15; }
.st small { color: var(--ink-2); font-size: 11px; }
.st b { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.st b em { font-style: normal; font-weight: 500; font-size: 12px; margin-left: 4px; }
.pos { color: var(--good); } .neg { color: var(--bad); } .gold { color: var(--gold); }
#bar nav { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.tb { background: none; border: 1px solid transparent; border-radius: 7px; padding: 6px 10px; color: var(--ink); }
.tb:hover { background: var(--paper-2); border-color: var(--line); }
.tb.badge::after { content: attr(data-n); margin-left: 6px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 600; }

#modes { position: absolute; left: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; z-index: 3; max-width: calc(100% - 2 * var(--gut)); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 10px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#legend { padding: 8px 10px; display: flex; gap: 4px 12px; flex-wrap: wrap; max-width: 520px; font-size: 12px; color: var(--ink-2); }
#legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

#side { position: absolute; top: calc(var(--barh, 56px) + 12px); right: var(--gut); width: 330px; max-width: calc(100% - 2 * var(--gut)); max-height: calc(100% - var(--barh, 56px) - 12px - 84px); overflow: auto; z-index: 4; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
#side h2 { font-size: 24px; line-height: 1.1; }
#side .sub { color: var(--ink-2); font-size: 13px; }
#side .desc { font-size: 13px; color: var(--ink-2); font-style: italic; }
.x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; font-size: 18px; line-height: 1; color: var(--ink-2); }
.x:hover { background: var(--paper-2); }
.owner { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--paper-2); border-radius: 20px; padding: 3px 11px 3px 5px; font-weight: 500; max-width: 100%; }
.owner i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.pill { display: inline-block; border-radius: 20px; padding: 1px 9px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.pill.war { color: var(--bad); } .pill.ally, .pill.vassal { color: var(--good); } .pill.pact, .pill.truce, .pill.lord { color: var(--warn); } .pill.peace, .pill.indep { color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.meter { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; position: relative; border: 1px solid var(--line); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.sec { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.sec h3 { font: 600 13px var(--body); color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.sec h3 span { font-weight: 400; color: var(--ink-2); }
.units { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.unit { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--paper-2); }
.unit small { color: var(--ink-2); font-size: 11px; }
.unit b { font-size: 17px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 11px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--bad); border-color: currentColor; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn small { font-weight: 400; opacity: .8; margin-left: 4px; }
.bl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.bl .lv { font-size: 12px; color: var(--ink-2); }
.pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-2); }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.hint { font-size: 12px; color: var(--ink-2); }

#end { position: absolute; right: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); z-index: 4; padding: 12px 22px; border-radius: 28px; border: 0; background: var(--ink); color: var(--paper); font: 400 18px var(--display); letter-spacing: .02em; box-shadow: var(--shadow); }
#end:hover { background: var(--accent); color: var(--accent-ink); }
#end small { display: block; font: 12px var(--body); opacity: .75; }

#order { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); width: 430px; max-width: calc(100% - 2 * var(--gut)); z-index: 6; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
#order h3 { font-size: 20px; }
.slider { display: grid; grid-template-columns: 84px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.odds { font-size: 13px; padding: 7px 10px; border-radius: 8px; background: var(--paper-2); border: 1px solid var(--line); }

#toasts { position: absolute; left: var(--gut); top: calc(var(--barh, 56px) + 12px); z-index: 7; display: flex; flex-direction: column; gap: 8px; width: 320px; max-width: calc(100% - 2 * var(--gut)); pointer-events: none; }
.toast { pointer-events: auto; padding: 10px 12px; font-size: 13px; border-left: 4px solid var(--ink-2); animation: tin .25s ease-out; cursor: pointer; }
.toast.win { border-left-color: var(--good); } .toast.loss { border-left-color: var(--bad); }
.toast .tt { display: block; font: 400 16px var(--display); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

#tip { position: absolute; z-index: 8; pointer-events: none; padding: 6px 10px; font-size: 12.5px; max-width: 240px; }
#tip b { font: 400 15px var(--display); display: block; }

/* ---------- ventanas ---------- */
#modal { position: absolute; inset: 0; z-index: 20; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: var(--gut); }
#modal > .sheet { position: relative; width: 760px; max-width: 100%; max-height: 100%; overflow: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
#modal > .sheet.narrow { width: 500px; }
#modal > .sheet.wide { width: 980px; }
#modal h2 { font-size: 28px; line-height: 1.1; padding-right: 30px; }
#modal p { max-width: 68ch; }
.lead { font: 400 17px/1.5 var(--display); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.split { display: grid; grid-template-columns: 250px 1fr; gap: 18px; min-height: 0; }
.list { display: flex; flex-direction: column; gap: 1px; max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 5px 7px; border-radius: 6px; min-width: 0; }
.li:hover { background: var(--paper-2); }
.li[aria-current="true"] { background: var(--accent-soft); }
.li i { width: 12px; height: 12px; border-radius: 50%; }
.li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li em { font-style: normal; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.li em.war { color: var(--bad); font-weight: 600; } .li em.ally { color: var(--good); font-weight: 600; }
.lgroup { font-size: 11.5px; color: var(--ink-2); padding: 7px 7px 2px; }
.detail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.detail h3 { font-size: 24px; }
.relbar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--bad), var(--paper-2) 50%, var(--good)); position: relative; border: 1px solid var(--line); }
.relbar i { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--ink); border-radius: 2px; }
.reply { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); font-size: 13.5px; }
.reply.ok { border-color: var(--good); } .reply.no { border-color: var(--bad); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; background: var(--paper-2); position: sticky; top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--paper-2); }
tbody tr:last-child td { border-bottom: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.chron { display: flex; flex-direction: column; gap: 2px; max-height: 62vh; overflow: auto; font-size: 13.5px; }
.chron .y { font: 400 18px var(--display); margin-top: 10px; position: sticky; top: 0; background: var(--paper); padding: 2px 0; }
.chron .e { padding: 2px 0 2px 12px; border-left: 2px solid var(--line); color: var(--ink-2); }
.chron .e.me { color: var(--ink); border-left-color: var(--accent); }
.chron .e.ev { font-style: italic; }
.rank { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; }
.rank .barw { height: 10px; border-radius: 5px; background: var(--paper-2); overflow: hidden; }
.rank .barw i { display: block; height: 100%; border-radius: 5px; }
.check { display: flex; flex-wrap: wrap; gap: 6px; }
.check span { border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; font-size: 13px; color: var(--ink-2); }
.check span.ok { border-color: var(--good); color: var(--good); font-weight: 600; }

/* ---------- pantalla inicial ---------- */
#start { position: absolute; inset: 0; z-index: 10; display: grid; grid-template-columns: minmax(300px, 400px) 1fr minmax(300px, 380px); gap: var(--gut); padding: calc(var(--gut) + env(safe-area-inset-top, 0px)) var(--gut) calc(var(--gut) + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
#start > * { pointer-events: auto; min-height: 0; }
#s-left, #s-right { display: flex; flex-direction: column; gap: 14px; padding: 20px; overflow: auto; }
#s-left { grid-column: 1; } #s-right { grid-column: 3; }
.brand h1 { font-size: 46px; line-height: 1; letter-spacing: .01em; }
.brand p { color: var(--ink-2); margin-top: 6px; }
.scn { display: flex; flex-direction: column; gap: 2px; }
.sc { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: baseline; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; border-left: 3px solid transparent; }
.sc:hover { background: var(--paper-2); }
.sc[aria-pressed="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.sc .yr { font: 400 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.sc .yr small { font: 11px var(--body); color: var(--ink-2); display: block; }
.sc b { font-weight: 600; display: block; } .sc span { color: var(--ink-2); font-size: 12.5px; }
.sdesc { font-size: 13.5px; color: var(--ink-2); }
.facs { display: flex; flex-direction: column; gap: 2px; }
.fc { display: grid; grid-template-columns: 16px 1fr auto; gap: 9px; align-items: center; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 8px; }
.fc:hover { background: var(--paper-2); }
.fc[aria-pressed="true"] { background: var(--accent-soft); }
.fc i { width: 14px; height: 14px; border-radius: 50%; }
.fc b { font-weight: 600; display: block; } .fc span span { color: var(--ink-2); font-size: 12.5px; display: block; }
.dif { display: inline-flex; gap: 3px; } .dif i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-2); } .dif i.on { background: var(--ink-2); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--paper-2); }
.card h3 { font-size: 22px; }
#s-go { padding: 12px 18px; font: 400 19px var(--display); border-radius: 28px; }
.more { background: none; border: 0; padding: 4px 8px; color: var(--accent); text-align: left; font-weight: 500; }

@media (max-width: 1080px) {
  #start { grid-template-columns: 1fr 1fr; overflow: auto; }
  #s-left { grid-column: 1; } #s-right { grid-column: 2; }
  #s-left, #s-right { background: var(--paper); }
}
@media (max-width: 720px) {
  #start { grid-template-columns: 1fr; overflow: auto; align-content: start; }
  #s-left, #s-right { grid-column: 1; overflow: visible; }
  .brand h1 { font-size: 38px; }
  #bar { gap: 4px 12px; padding-bottom: 6px; }
  #bar nav { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .stats { gap: 12px; }
  #side { top: auto; right: 0; left: 0; bottom: 0; width: auto; max-width: none; max-height: 46%; border-radius: var(--r) var(--r) 0 0; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  #modes { bottom: auto; top: calc(var(--barh, 120px) + 8px); }
  #modes .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  #modes .seg button { padding: 4px 8px; font-size: 12.5px; white-space: nowrap; }
  #legend { display: none; }
  #toasts { top: calc(var(--barh, 120px) + 52px); }
  .split { grid-template-columns: 1fr; }
  .list { max-height: 32vh; }
  #modal > .sheet { padding: 18px 16px; }
  #end { padding: 10px 18px; z-index: 6; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  const mkAlly = g => { const d = dip(f, g); d.ally = true; d.r = Math.max(d.r, 30) + 10; logEv('dip', facName(f) + ' y ' + facName(g) + ' sellan una alianza.', [f, g]); };
  const es = enemiesOf(f);
  if (es.length && rnd() < 0.2) {
    const c = aliveFactions().filter(g => g !== f && !atWar(f, g) && !allied(f, g) && !G.V[g] && rel(f, g) > 0 && es.some(e => atWar(g, e)));
    if (c.length) { const g = pick(c); if (g === p) { const d = dip(f, p); if ((d.askedA || -9999) < G.year - 4) { d.askedA = G.year; notify({ type: 'alliance', from: f }); } } else mkAlly(g); }
  }
  if (heg && heg !== f && !allied(f, heg) && bordering(f, heg) && rnd() < 0.2) {
    const c = neighborFactions(heg).filter(g => g !== f && !atWar(f, g) && !allied(f, g) && !allied(g, heg) && !G.V[g] && rel(f, g) > -15);
    if (c.length) { const g = pick(c); if (g === p) { const d = dip(f, p); if ((d.askedA || -9999) < G.year - 4) { d.askedA = G.year; notify({ type: 'alliance', from: f }); } } else mkAlly(g); }
  }
  // guerra
  if (es.length < (st.n > 12 ? 2 : 1) && F.exh < 10 && G.year - (F.lastWar || -9999) >= 3 && rnd() < 0.55) {
    const claims = (FACTIONS[f].claims || []).concat(F.lost || []);
    let best = null, bs = 0;
    for (const o of neighborFactions(f)) {
      const d = dip(f, o);
      if (d.war || d.ally || d.truce > G.year || d.pact > G.year || G.V[o] === f || G.V[f] === o) continue;
      let opp = fstat(o).power;
      for (const a of alliesOf(o)) if (!allied(a, f)) opp += fstat(a).power * 0.5;
      if (G.V[o]) opp += fstat(G.V[o]).power * 0.6;
      let s = st.power / opp;
      const nc = claims.filter(x => G.P[x].o === o).length;
      s *= 1 + Math.min(1, nc * 0.25);
      if (!nc && d.r > -20) s *= 0.45;   // sin agravio ni ambición, rara vez hay guerra
      if (st.n > 22) s *= st.n > 40 ? 0.3 : st.n > 30 ? 0.5 : 0.7;   // los imperios saciados se vuelven conservadores
      s *= d.r < -30 ? 1.3 : d.r > 30 ? 0.5 : 1;
      if (d.marr > G.year) s *= 0.6;
      if (enemiesOf(o).length) s *= 1.25;
      if (o === p) s *= [0.6, 1, 1.35][G.diff] * (G.turn < 3 ? 0.3 : 1);
      if (s > bs) { bs = s; best = o; }
    }
    if (best && bs > 1.6 && rnd() < 0.3 * aggr + 0.05) { F.lastWar = G.year; declareWar(f, best); return; }
    // ultimátum al jugador débil
    if (p && G.F[p].alive && bordering(f, p) && !G.V[p] && dipStatus(f, p) === 'peace' && rel(f, p) < 5 && st.power > fstat(p).power * 3 && G.turn > 3 && rnd() < 0.07 * aggr) {
      const d = dip(f, p);
      if ((d.askedU || -9999) < G.year - 8) { d.askedU = G.year; notify({ type: 'ultimatum', from: f, gold: Math.max(30, Math.round(fstat(p).gross * 0.6)) }); }
    }
  }
}

function aiTurn(f) {
  if (!G.F[f].alive || !owned(f).length) return;
  aiDiplomacy(f);
  if (!G.F[f].alive) return;
  aiEconomy(f);
  aiMilitary(f);
}

// ===================== Acontecimientos históricos =====================
const alive = f => !!(G.F[f] && G.F[f].alive);
const isAI = f => f !== G.player;
const own = pid => G.P[pid].o;
const HEL = f => f !== 'indep' && CUL[FACTIONS[f].cul].f === 'hel';

// Un ejército de f irrumpe en la provincia (invasión o alzamiento). Devuelve true si la toma.
function invade(f, pid, units) {
  const P = G.P[pid], old = P.o;
  if (old === f) { addU(P.u, units); return true; }
  const was = alive(f);
  ensureFaction(f, pid);
  if (old !== 'indep' && !atWar(f, old)) { const d = dip(f, old); d.war = true; d.since = G.year; d.ws = 0; d.via = null; d.r = Math.min(d.r, -60); }
  const rep = battle(f, null, pid, units);
  if (!rep.win && !was && owned(f).length === 0) {
    G.F[f].alive = false;
    for (const k of Object.keys(G.D)) { const [a, b] = k.split('|'); if (a === f || b === f) delete G.D[k]; }
    invalidate();
  }
  return rep.win;
}
// Las provincias se pasan a f con sus guarniciones. Si son del jugador, este puede resistir.
function secede(f, pids, o) {
  o = o || {}; let any = false;
  for (const pid of pids) {
    const P = G.P[pid], old = P.o;
    if (old === f || (o.only && !o.only.includes(old))) continue;
    if (old === G.player) {
      const S = PROV[pid];
      if (invade(f, pid, splitUnits(Math.round((S.mp * 2 + S.w + 2) * (o.str || 1)), facMix(f)))) any = true;
    } else {
      const keep = P.u.slice();
      transfer(pid, f, { peace: true, quiet: true, loy: 70 });
      P.u = keep; if (usum(P.u) < 4) P.u[0] += 4;
      any = true;
      if (old !== 'indep' && alive(old)) { const d = dip(f, old); d.r = Math.min(d.r, -40); if (o.war && !d.war) { d.war = true; d.since = G.year; d.ws = 0; d.via = null; } }
    }
  }
  invalidate();
  return any;
}
function addLoy(f, n, except) { for (const pid of owned(f)) if (pid !== except) G.P[pid].loy = clamp(G.P[pid].loy + n, 5, 100); }
function reinforce(f, units) { const c = G.F[f].cap; if (c && own(c) === f) addU(G.P[c].u, units); invalidate(); }

  const next = () => { refresh(); flushMsgs(); };
  const me = G.player;
  if (m.from && (!G.F[m.from] || !G.F[m.from].alive)) return flushMsgs();
  if (m.type === 'peace') {
    if (!atWar(me, m.from)) return flushMsgs();
    openModal(`<h2>${esc(facName(m.from))} ofrece la paz</h2><p class="lead">Los embajadores de ${esc(ruler(m.from).name)} proponen deponer las armas y que cada cual conserve lo que tiene. Seguiría una tregua de ocho años.</p><div class="acts"><button class="btn" data-m="no">Rechazar</button><button class="btn pri" data-m="yes">Firmar la paz</button></div>`, 'narrow',
      a => { if (a === 'yes') makePeace(me, m.from); closeModal(); }, next);
  } else if (m.type === 'alliance') {
    if (atWar(me, m.from) || allied(me, m.from)) return flushMsgs();
    openModal(`<h2>${esc(facName(m.from))} propone una alianza</h2><p class="lead">${esc(ruler(m.from).name)} os ofrece un pacto de ayuda mutua. Si uno es atacado, el otro acudirá.</p><div class="acts"><button class="btn" data-m="no">Declinar</button><button class="btn pri" data-m="yes">Aceptar la alianza</button></div>`, 'narrow',
      a => { if (a === 'yes') { const d = dip(me, m.from); d.ally = true; d.r = Math.min(100, d.r + 15); logEv('dip', facName(me) + ' y ' + facName(m.from) + ' sellan una alianza.', [me, m.from]); } closeModal(); }, next);
  } else if (m.type === 'ultimatum') {
    if (atWar(me, m.from)) return flushMsgs();
    const can = G.F[me].gold >= m.gold;
    openModal(`<h2>Ultimátum de ${esc(facName(m.from))}</h2><p class="lead">${esc(ruler(m.from).name)} exige ${m.gold} talentos como prueba de amistad. Si te niegas, habrá guerra.</p><div class="acts"><button class="btn dng" data-m="no">Negarse</button><button class="btn pri" data-m="yes" ${can ? '' : 'disabled title="No tienes tanto oro"'}>Pagar ${m.gold} talentos</button></div>`, 'narrow',
      a => { if (a === 'yes') { G.F[me].gold -= m.gold; G.F[m.from].gold += m.gold; const d = dip(me, m.from); d.pact = G.year + 6; d.r += 10; } else declareWar(m.from, me, { silent: true }); UI.modal.done = true; closeModal(); },
      () => { if (!atWar(me, m.from) && !(dip(me, m.from).pact > G.year)) declareWar(m.from, me, { silent: true }); next(); });

  }

    if (G.V[f] && G.V[f] !== me) notes.push('Tributario de ' + facName(G.V[f]) + '.');
    const B = (k, label, o) => { o = o || {}; return `<button class="btn ${o.cls || ''}" data-m="do:${k}${o.arg != null ? ':' + o.arg : ''}" ${o.off ? 'disabled title="' + o.off + '"' : ''}>${label}</button>`; };
    const gold = G.F[me].gold; let acts = '';
    if (s === 'war') acts = B('peace', 'Proponer la paz') + B('peace_pay', 'Ofrecer 100 talentos por la paz', { arg: 100, off: gold < 100 ? 'No tienes 100 talentos' : '' }) + B('peace_tribute', 'Exigir 100 talentos', { arg: 100 }) + B('peace_vassal', 'Exigir sumisión');

      if (s !== 'ally' && s !== 'vassal' && s !== 'lord') acts += B('ally', 'Proponer alianza');
      if (s === 'peace' || s === 'truce') acts += B('pact', 'Pacto de no agresión');

      acts += B('gift', 'Enviar un regalo (50)', { arg: 50, off: gold < 50 ? 'No tienes 50 talentos' : '' });
